services:
  next:
    build:
      dockerfile: docker/next/Dockerfile
      # The build needs .env (Contentful, NEXT_PUBLIC_*), but only while building: as a
      # secret it never ends up in an image layer.
      secrets:
        - env
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    networks:
      - web
    # Caddy proxies to it; Docker bypasses ufw, so bind to localhost only.
    ports:
      - "127.0.0.1:3550:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  env:
    file: .env

networks:
  web:
    driver: bridge
